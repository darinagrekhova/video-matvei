<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Video Diary</title>
  <meta name="theme-color" content="#000000" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body { cursor: pointer; }
    #player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: #000;
    }
  </style>
</head>
<body>
  <video id="player" autoplay muted playsinline preload="auto"></video>
  <audio id="backgroundAudio" loop preload="auto">
    <source src="audio/background.mp3" type="audio/mpeg">
  </audio>

  <script>
    const clips = [
      "01", "02", "03", "04", "05", "06",
      "07", "08", "09", "10", "11"
    ];

    const player = document.getElementById("player");
    const backgroundAudio = document.getElementById("backgroundAudio");

    backgroundAudio.volume = 0.35;

    let audioStarted = false;
    let index = Math.floor(Math.random() * clips.length);
    let currentVariant = getVariant();

    function getVariant() {
      return window.matchMedia("(max-width: 900px)").matches
        ? "mobile"
        : "desktop";
    }

    function fileFor(clip, variant = currentVariant) {
      return `video/${clip}_${variant}.mp4`;
    }

    async function startAudio() {
      if (audioStarted) return;

      try {
        await backgroundAudio.play();
        audioStarted = true;
      } catch (error) {
        console.log("Audio playback needs user interaction:", error);
      }
    }

    async function loadClip(newIndex) {
      index = (newIndex + clips.length) % clips.length;
      currentVariant = getVariant();
      player.src = fileFor(clips[index]);
      player.load();

      try {
        await player.play();
      } catch (error) {
        console.log("Playback needs user interaction:", error);
      }
    }

    function nextClip() {
      loadClip(index + 1);
    }

    function previousClip() {
      loadClip(index - 1);
    }

    player.addEventListener("ended", nextClip);

    document.addEventListener("click", () => {
      startAudio();
      nextClip();
    });

    document.addEventListener("keydown", (event) => {
      if (
        event.code === "Space" ||
        event.code === "ArrowRight" ||
        event.code === "ArrowLeft"
      ) {
        startAudio();
      }

      if (event.code === "Space" || event.code === "ArrowRight") {
        event.preventDefault();
        nextClip();
      } else if (event.code === "ArrowLeft") {
        event.preventDefault();
        previousClip();
      }
    });

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const nextVariant = getVariant();

        if (nextVariant !== currentVariant) {
          const currentTime = player.currentTime || 0;
          currentVariant = nextVariant;
          player.src = fileFor(clips[index], currentVariant);
          player.load();

          player.addEventListener("loadedmetadata", async () => {
            if (currentTime < player.duration) {
              player.currentTime = currentTime;
            }
            try {
              await player.play();
            } catch (_) {}
          }, { once: true });
        }
      }, 250);
    });

    loadClip(index);
  </script>
</body>
</html>
